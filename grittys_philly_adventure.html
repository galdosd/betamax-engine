<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Gritty's Philly Adventure</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #1a1a2e; color: #e0e0e0; font-family: 'Courier New', monospace; display: flex; height: 100vh; overflow: hidden; }

#game-container { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 0; }
#game-header { color: #ff8200; font-size: 14px; margin-bottom: 4px; text-align: center; }
#game-header span { color: #aaa; font-size: 11px; }
canvas { border: 2px solid #444; cursor: pointer; image-rendering: pixelated; display: block; }
#game-footer { color: #888; font-size: 11px; margin-top: 4px; text-align: center; }

#console-panel {
  width: 320px; min-width: 320px; background: #0d0d1a; border-left: 2px solid #333;
  display: flex; flex-direction: column; font-size: 11px; overflow: hidden;
}
#console-header {
  background: #1a1a3a; padding: 6px 10px; border-bottom: 1px solid #333;
  font-size: 13px; color: #ff8200; font-weight: bold;
}
#console-tabs { display: flex; border-bottom: 1px solid #333; }
.tab {
  padding: 5px 12px; cursor: pointer; color: #888; border-bottom: 2px solid transparent;
  font-size: 11px; user-select: none;
}
.tab:hover { color: #ccc; }
.tab.active { color: #ff8200; border-bottom-color: #ff8200; }

.console-section { flex: 1; overflow-y: auto; padding: 6px; display: none; }
.console-section.active { display: block; }

#log-output { white-space: pre-wrap; color: #8f8; line-height: 1.4; }
#sprites-output { line-height: 1.5; }
#state-output { line-height: 1.5; }
#perf-output { line-height: 1.6; }

.sprite-entry { padding: 2px 4px; border-bottom: 1px solid #1a1a2e; }
.sprite-entry:hover { background: #1a1a3a; }
.sprite-name { color: #6cf; }
.sprite-type { color: #f8a; }
.sprite-pos { color: #aaa; }
.state-key { color: #fc6; }
.state-val { color: #8f8; }
.perf-label { color: #aaa; }
.perf-val { color: #6f6; font-weight: bold; }
.perf-warn { color: #fa0; }

#console-input-bar {
  border-top: 1px solid #333; padding: 4px; display: flex;
}
#console-input {
  flex: 1; background: #111; border: 1px solid #333; color: #0f0;
  padding: 3px 6px; font-family: 'Courier New', monospace; font-size: 11px;
  outline: none;
}
#console-input:focus { border-color: #ff8200; }
</style>
</head>
<body>

<div id="game-container">
  <div id="game-header">GRITTY'S PHILLY ADVENTURE <span>// betamax-engine web port</span></div>
  <canvas id="game" width="960" height="540"></canvas>
  <div id="game-footer">Click or press SPACE to jump &bull; Running on betamax-web</div>
</div>

<div id="console-panel">
  <div id="console-header">betamax console</div>
  <div id="console-tabs">
    <div class="tab active" data-tab="log">Log</div>
    <div class="tab" data-tab="sprites">Sprites</div>
    <div class="tab" data-tab="state">State</div>
    <div class="tab" data-tab="perf">Perf</div>
  </div>
  <div id="log-section" class="console-section active"><div id="log-output"></div></div>
  <div id="sprites-section" class="console-section"><div id="sprites-output"></div></div>
  <div id="state-section" class="console-section"><div id="state-output"></div></div>
  <div id="perf-section" class="console-section"><div id="perf-output"></div></div>
  <div id="console-input-bar">
    <input id="console-input" type="text" placeholder="eval js...">
  </div>
</div>

<script>
// ============================================================================
// Gritty's Philly Adventure — JS/Canvas port of betamax-engine platformer
// ============================================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = 960, H = 540;
const S = 4; // pixel art scale

// --- Console / logging ---
const MAX_LOG = 200;
const logLines = [];
function log(msg) {
  logLines.push(msg);
  if (logLines.length > MAX_LOG) logLines.shift();
}

// --- Color palette (NES-inspired, matching Python generator) ---
const C = {
  SKY_BLUE: [92,148,252], SKY_LIGHT: [146,184,254],
  SIDEWALK: [190,190,185], CURB_GRAY: [120,120,120],
  SKYLINE_DARK: [40,45,60], SKYLINE_MED: [60,65,80],
  WINDOW_LIT: [255,230,120],
  GRITTY_ORANGE: [255,130,0], GRITTY_DARK: [200,100,0],
  GRITTY_BELLY: [255,160,50], EYE_WHITE: [255,255,255], EYE_BLACK: [0,0,0],
  MOUTH: [40,40,40],
  PIGEON_GRAY: [140,145,155], PIGEON_DARK: [100,105,115],
  PIGEON_HEAD: [80,120,80], PIGEON_BEAK: [220,180,50], PIGEON_EYE: [200,50,0],
  CHEESE_BREAD: [220,180,100], CHEESE_DARK: [190,150,80],
  CHEESE_YELLOW: [255,220,80], CHEESE_MEAT: [160,80,50], CHEESE_SPARKLE: [255,255,200],
  POLE_SILVER: [200,210,220], POLE_SHINE: [240,245,255], POLE_DARK: [150,155,165],
  CLOUD_WHITE: [255,255,255], CLOUD_LIGHT: [235,240,250],
  TRASH_GREEN: [60,100,60], TRASH_DARK: [40,70,40], TRASH_LID: [80,120,80],
  BOOT_YELLOW: [255,200,0], BOOT_DARK: [200,150,0], BOOT_CLAMP: [100,100,100],
  IMPOUND_SKY: [30,20,40], IMPOUND_FENCE: [160,170,175], IMPOUND_CONCRETE: [140,140,135],
  BELL_BRONZE: [180,140,60], BELL_DARK: [140,100,40], BELL_SHINE: [220,180,80],
  PRETZEL_BROWN: [180,120,50], PRETZEL_DARK: [140,90,30], PRETZEL_SALT: [240,240,230],
  BOSS_BLUE: [30,50,120], BOSS_PANTS: [40,40,60], BOSS_SKIN: [210,170,130],
  BOSS_HAT: [20,30,60], BOSS_BADGE: [220,200,50],
  CAR_ORANGE: [230,120,0], CAR_DARK: [180,90,0], CAR_WINDOW: [100,150,200],
  CAR_TIRE: [40,40,40], CAR_RUST: [160,80,30],
  HOOK_METAL: [170,170,175], HOOK_DARK: [120,120,130], HOOK_CHAIN: [150,150,160],
  HILL_GREEN: [40,80,30],
};

function rgba(c, a) { return `rgba(${c[0]},${c[1]},${c[2]},${a !== undefined ? a : 1})`; }
function rgb(c) { return `rgb(${c[0]},${c[1]},${c[2]})`; }

// --- Coordinate conversion ---
// betamax TextureCoordinate: (0,0)=bottom-left, (1,1)=top-right
// canvas: (0,0)=top-left
function texToCanvas(tx, ty) { return [tx * W, (1 - ty) * H]; }

// --- Pixel art drawing helpers ---
function px(x, y, color, size) {
  size = size || S;
  ctx.fillStyle = rgb(color);
  ctx.fillRect(Math.round(x), Math.round(y), size, size);
}

function rect(x, y, w, h, color) {
  ctx.fillStyle = rgb(color);
  ctx.fillRect(Math.round(x), Math.round(y), w, h);
}

// ============================================================================
// Background renderers (cached to offscreen canvas for performance)
// ============================================================================
let bgStreetCanvas, bgImpoundCanvas;

function renderBgStreet() {
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const g = c.getContext('2d');

  // Sky gradient
  for (let y = 0; y < H; y++) {
    let t = Math.min(1, y / (H * 0.6));
    let r = C.SKY_LIGHT[0] + (C.SKY_BLUE[0] - C.SKY_LIGHT[0]) * t;
    let gr_ = C.SKY_LIGHT[1] + (C.SKY_BLUE[1] - C.SKY_LIGHT[1]) * t;
    let b = C.SKY_LIGHT[2] + (C.SKY_BLUE[2] - C.SKY_LIGHT[2]) * t;
    g.fillStyle = `rgb(${r|0},${gr_|0},${b|0})`;
    g.fillRect(0, y, W, 1);
  }

  const groundTop = H * 0.78 | 0;

  // Skyline
  const buildings = [
    [50,180,60],[120,220,80],[210,160,40],[260,250,70],[340,200,55],
    [410,170,45],[465,230,65],[540,190,50],[600,210,60],[670,180,40],
    [720,240,70],[800,200,55],[865,170,45]
  ];
  for (const [bx, bh, bw] of buildings) {
    let by = groundTop - bh;
    g.fillStyle = rgb(C.SKYLINE_DARK);
    g.fillRect(bx, by, bw, bh);
    for (let wy = by + 8; wy < by + bh - 8; wy += 12) {
      for (let wx = bx + 6; wx < bx + bw - 6; wx += 10) {
        g.fillStyle = ((wx + wy) % 3 !== 0) ? rgb(C.WINDOW_LIT) : rgb(C.SKYLINE_MED);
        g.fillRect(wx, wy, 4, 6);
      }
    }
  }

  // Sidewalk
  g.fillStyle = rgb(C.SIDEWALK);
  g.fillRect(0, groundTop, W, H - groundTop);
  g.fillStyle = rgb(C.CURB_GRAY);
  g.fillRect(0, groundTop, W, 4);
  for (let x = 0; x < W; x += 80) {
    g.fillStyle = rgb(C.CURB_GRAY);
    g.fillRect(x, groundTop + 4, 1, H - groundTop - 4);
  }

  // Street
  let streetTop = H * 0.92 | 0;
  g.fillStyle = 'rgb(80,80,80)';
  g.fillRect(0, streetTop, W, H - streetTop);
  g.fillStyle = 'rgb(220,220,50)';
  for (let x = 0; x < W; x += 60) g.fillRect(x, streetTop + 8, 30, 3);

  return c;
}

function renderBgImpound() {
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const g = c.getContext('2d');

  // Dark sky
  for (let y = 0; y < H; y++) {
    let t = y / H;
    let r = C.IMPOUND_SKY[0] * (1 - t * 0.3) | 0;
    let gr_ = C.IMPOUND_SKY[1] * (1 - t * 0.3) | 0;
    let b = C.IMPOUND_SKY[2] * (1 - t * 0.3) | 0;
    g.fillStyle = `rgb(${r},${gr_},${b})`;
    g.fillRect(0, y, W, 1);
  }

  const groundTop = H * 0.78 | 0;

  // Fence posts
  g.fillStyle = rgb(C.IMPOUND_FENCE);
  for (let x = 0; x < W; x += 100) {
    g.fillRect(x, groundTop - 120, 6, 120);
    g.fillRect(x - 2, groundTop - 124, 10, 4);
  }

  // Chain-link hatching
  g.strokeStyle = 'rgba(140,150,155,0.35)';
  g.lineWidth = 1;
  for (let y = groundTop - 120; y < groundTop; y += 8) {
    for (let x = 0; x < W; x += 8) {
      g.beginPath();
      if ((x + y) % 16 < 8) { g.moveTo(x, y); g.lineTo(x + 8, y + 8); }
      else { g.moveTo(x + 8, y); g.lineTo(x, y + 8); }
      g.stroke();
    }
  }

  // PPA IMPOUND sign
  let sx = 350, sy = groundTop - 100;
  g.fillStyle = 'rgb(200,30,30)'; g.fillRect(sx, sy, 260, 40);
  g.fillStyle = 'rgb(220,50,50)'; g.fillRect(sx + 2, sy + 2, 256, 36);
  g.fillStyle = '#fff'; g.font = 'bold 20px Courier New';
  g.fillText('PPA IMPOUND', sx + 30, sy + 28);

  // Concrete ground
  g.fillStyle = rgb(C.IMPOUND_CONCRETE);
  g.fillRect(0, groundTop, W, H - groundTop);
  g.fillStyle = 'rgb(100,100,95)';
  g.fillRect(0, groundTop, W, 4);

  // Parking lines
  g.fillStyle = 'rgba(220,220,50,0.7)';
  for (let x = 60; x < W; x += 120) g.fillRect(x, groundTop + 10, 3, H - groundTop - 10);

  // Oil stains
  for (const ox of [150, 400, 700]) {
    g.fillStyle = 'rgba(60,50,40,0.4)';
    g.beginPath(); g.ellipse(ox, groundTop + 30, 16, 8, 0, 0, Math.PI * 2); g.fill();
  }

  return c;
}

// ============================================================================
// Sprite drawing functions (draw at canvas coordinates cx, cy = center)
// ============================================================================
function drawGritty(cx, cy, frame) {
  const s = S;
  const legOff = (frame === 0 || frame === 4) ? 1 : (frame === 1 || frame === 5) ? -1 : 0;
  const armsUp = frame === 3;

  // Helper to draw pixel relative to center
  function p(dx, dy, c) { px(cx + dx * s, cy + dy * s, c, s); }
  function pBlock(dxStart, dxEnd, dyStart, dyEnd, colorFn) {
    for (let dy = dyStart; dy <= dyEnd; dy++)
      for (let dx = dxStart; dx <= dxEnd; dx++)
        p(dx, dy, colorFn(dx, dy));
  }

  // Body
  for (let dy = -7; dy <= 0; dy++) {
    let w = dy > -3 ? 5 : (dy > -6 ? 4 : 3);
    for (let dx = -w; dx <= w; dx++)
      p(dx, dy, (dx + dy) % 3 !== 0 ? C.GRITTY_ORANGE : C.GRITTY_DARK);
  }

  // Belly
  for (let dy = -4; dy < -1; dy++)
    for (let dx = -3; dx <= 3; dx++)
      if (Math.abs(dx) + Math.abs(dy + 3) < 4) p(dx, dy, C.GRITTY_BELLY);

  // Head
  for (let dy = -14; dy <= -7; dy++) {
    let w = (-12 < dy && dy < -8) ? 5 : (dy > -13 ? 4 : 3);
    for (let dx = -w; dx <= w; dx++)
      p(dx, dy, (dx + dy) % 2 !== 0 ? C.GRITTY_ORANGE : C.GRITTY_DARK);
  }

  // Googly eyes
  for (let dx = -4; dx <= -1; dx++)
    for (let dy = -13; dy <= -10; dy++) p(dx, dy, C.EYE_WHITE);
  p(-3, -12, C.EYE_BLACK); p(-2, -12, C.EYE_BLACK);
  for (let dx = 1; dx <= 3; dx++)
    for (let dy = -13; dy <= -10; dy++) p(dx, dy, C.EYE_WHITE);
  p(2, -12, C.EYE_BLACK); p(1, -12, C.EYE_BLACK);

  // Mouth
  for (let dx = -3; dx <= 3; dx++) p(dx, -9, C.MOUTH);
  for (let dx = -2; dx <= 2; dx++) if (dx % 2 === 0) p(dx, -9, C.EYE_WHITE);

  // Arms
  if (armsUp) {
    for (let dy = -10; dy <= -7; dy++) { p(-6, dy, C.GRITTY_ORANGE); p(6, dy, C.GRITTY_ORANGE); }
  } else {
    p(-6, -5 + legOff, C.GRITTY_ORANGE); p(-6, -4 + legOff, C.GRITTY_ORANGE);
    p(6, -5 - legOff, C.GRITTY_ORANGE); p(6, -4 - legOff, C.GRITTY_ORANGE);
  }

  // Legs
  for (let dy = 1; dy <= 3; dy++) {
    p(-2 - legOff, dy, C.GRITTY_DARK); p(2 + legOff, dy, C.GRITTY_DARK);
  }
  // Shoes
  p(-2 - legOff, 4, C.EYE_BLACK); p(-3 - legOff, 4, C.EYE_BLACK);
  p(2 + legOff, 4, C.EYE_BLACK); p(3 + legOff, 4, C.EYE_BLACK);
}

function drawPigeon(cx, cy, frame) {
  const s = S, legOff = frame === 0 ? 1 : -1;
  function p(dx, dy, c) { px(cx + dx * s, cy + dy * s, c, s); }
  for (let dy = -3; dy <= 1; dy++) {
    let w = (-2 <= dy && dy <= 0) ? 4 : 3;
    for (let dx = -w; dx <= w; dx++)
      p(dx, dy, (dx + dy) % 3 !== 0 ? C.PIGEON_GRAY : C.PIGEON_DARK);
  }
  for (let dy = -6; dy <= -3; dy++) {
    let w = dy === -5 ? 2 : (dy === -4 ? 2 : 1);
    for (let dx = 2; dx <= 2 + w; dx++) p(dx, dy, C.PIGEON_HEAD);
  }
  p(3, -5, C.PIGEON_EYE);
  p(5, -4, C.PIGEON_BEAK);
  p(-5, -1, C.PIGEON_DARK); p(-4, -1, C.PIGEON_DARK);
  const legC = [180,120,60];
  p(0 + legOff, 2, legC); p(0 + legOff, 3, legC);
  p(2 - legOff, 2, legC); p(2 - legOff, 3, legC);
}

function drawTrashcan(cx, cy) {
  const s = S;
  function p(dx, dy, c) { px(cx + dx * s, cy + dy * s, c, s); }
  for (let dy = -6; dy <= 3; dy++) {
    let w = dy > -4 ? 4 : 3;
    for (let dx = -w; dx <= w; dx++)
      p(dx, dy, (dx + dy) % 4 !== 0 ? C.TRASH_GREEN : C.TRASH_DARK);
  }
  for (let dx = -5; dx <= 5; dx++) { p(dx, -7, C.TRASH_LID); p(dx, -8, C.TRASH_LID); }
  for (let dx = -1; dx <= 1; dx++) p(dx, -9, C.TRASH_DARK);
  p(-3, -9, [200,200,180]); p(2, -10, [180,170,150]);
}

function drawCheesesteak(cx, cy, frame) {
  const s = S;
  function p(dx, dy, c) { px(cx + dx * s, cy + dy * s, c, s); }
  for (let dx = -6; dx <= 6; dx++) {
    let h = Math.abs(dx) < 5 ? 2 : 1;
    for (let dy = -h; dy <= h; dy++)
      p(dx, dy, dy < 0 ? C.CHEESE_BREAD : C.CHEESE_DARK);
  }
  for (let dx = -5; dx <= 5; dx++) p(dx, -1, C.CHEESE_YELLOW);
  for (let dx = -3; dx <= 3; dx += 2) p(dx, 0, C.CHEESE_YELLOW);
  for (let dx = -4; dx <= 4; dx++) p(dx, 0, C.CHEESE_MEAT);
  const sparkles = [[-8,-4],[7,-3],[-6,3],[8,2]];
  if (frame < sparkles.length) {
    const [sx, sy] = sparkles[frame];
    p(sx, sy, C.CHEESE_SPARKLE); p(sx-1, sy, C.CHEESE_SPARKLE);
    p(sx+1, sy, C.CHEESE_SPARKLE); p(sx, sy-1, C.CHEESE_SPARKLE);
    p(sx, sy+1, C.CHEESE_SPARKLE);
  }
}

function drawGreasedPole(cx, cy) {
  const s = S;
  function p(dx, dy, c) { px(cx + dx * s, cy + dy * s, c, s); }
  for (let dy = -16; dy <= 7; dy++)
    for (let dx = -1; dx <= 1; dx++)
      p(dx, dy, dx === 0 ? C.POLE_SHINE : (dx === -1 ? C.POLE_DARK : C.POLE_SILVER));
  for (let dx = -3; dx <= 3; dx++) for (let dy = 6; dy <= 7; dy++) p(dx, dy, C.POLE_DARK);
  for (const dy of [-10, -5, 0, 4]) p(2, dy, [255,255,255]);
  for (let dy = -16; dy <= -12; dy++)
    for (let dx = 2; dx <= 7; dx++)
      p(dx, dy, (dx + dy) % 2 === 0 ? [255,100,0] : C.EYE_BLACK);
}

function drawCloud(cx, cy) {
  const s = S;
  function p(dx, dy, c) { px(cx + dx * s, cy + dy * s, c, s); }
  for (let dx = -10; dx <= 10; dx++) {
    let maxDy = 2;
    if (Math.abs(dx) < 6) maxDy = 4;
    if (Math.abs(dx) < 3) maxDy = 5;
    for (let dy = -maxDy; dy <= maxDy; dy++) {
      if (dx * dx / 100 + dy * dy / 25 < 1)
        p(dx, dy, dy < 0 ? C.CLOUD_WHITE : C.CLOUD_LIGHT);
    }
  }
}

function drawHill(cx, cy) {
  const s = S;
  for (let dx = -18; dx <= 18; dx++) {
    let h = Math.max(0, (10 * (1 - (dx / 18) ** 2)) | 0);
    for (let dy = -h; dy <= 0; dy++) {
      let shade = Math.max(0, Math.min(255, 80 + dy * 3));
      px(cx + dx * s, cy + dy * s, [40, shade, 30], s);
    }
  }
}

function drawLibertyBell(cx, cy) {
  const s = S;
  function p(dx, dy, c) { px(cx + dx * s, cy + dy * s, c, s); }
  for (let dy = -8; dy <= 5; dy++) {
    let w = dy < -5 ? 2 : (dy < -2 ? 3 + (dy + 5) : (dy < 2 ? 6 : 7));
    for (let dx = -w; dx <= w; dx++) {
      let c = (dx === -1 || dx === 0) ? C.BELL_SHINE : (Math.abs(dx) === w ? C.BELL_DARK : C.BELL_BRONZE);
      p(dx, dy, c);
    }
  }
  for (const [cx_, cy_] of [[0,-4],[1,-3],[0,-2],[-1,-1],[0,0],[1,1],[0,2]])
    p(cx_, cy_, [40,30,20]);
  for (let dx = -3; dx <= 3; dx++) p(dx, -9, [100,80,50]);
  for (let dx = -1; dx <= 1; dx++) p(dx, -10, [100,80,50]);
  p(0, 6, C.BELL_DARK); p(0, 7, C.BELL_DARK);
}

function drawPretzel(cx, cy) {
  const s = S;
  function p(dx, dy, c) { px(cx + dx * s, cy + dy * s, c, s); }
  for (let dx = -4; dx <= 4; dx++)
    for (let dy = -5; dy <= 5; dy++) {
      let d1 = (dx + 2) ** 2 + dy * dy, d2 = (dx - 2) ** 2 + dy * dy;
      if ((d1 >= 6 && d1 <= 16) || (d2 >= 6 && d2 <= 16))
        p(dx, dy, (dx + dy) % 3 !== 0 ? C.PRETZEL_BROWN : C.PRETZEL_DARK);
    }
  for (const [sx, sy] of [[-2,-4],[3,-3],[0,2],[-3,1],[2,3]]) p(sx, sy, C.PRETZEL_SALT);
}

function drawParkingBoot(cx, cy, frame) {
  const s = S, off = frame === 1 ? 2 : 0;
  function p(dx, dy, c) { px(cx + dx * s, cy + dy * s, c, s); }
  for (let dy = -3; dy <= 3; dy++)
    for (let dx = -5; dx <= 5; dx++)
      if (Math.abs(dy) < 3 && Math.abs(dx) < 5) p(dx, dy - off, C.BOOT_YELLOW);
  for (let dx = -6; dx <= 6; dx++) { p(dx, -3 - off, C.BOOT_DARK); p(dx, 3 + off, C.BOOT_DARK); }
  for (let dx = -1; dx <= 1; dx++) for (let dy = -2; dy <= 0; dy++) p(dx, dy, C.BOOT_CLAMP);
  p(0, -1, C.EYE_BLACK);
}

function drawTowHook(cx, cy, frame) {
  const s = S, swing = frame === 1 ? 2 : -2;
  function p(dx, dy, c) { px(cx + dx * s, cy + dy * s, c, s); }
  for (let dy = -12; dy <= -4; dy++) {
    p(swing / 2 | 0, dy, C.HOOK_CHAIN);
    if (dy % 2 === 0) p((swing / 2 | 0) + 1, dy, C.HOOK_CHAIN);
  }
  for (let dy = -4; dy <= 1; dy++) p(swing, dy, C.HOOK_METAL);
  for (let dx = 0; dx <= 3; dx++) p(swing + dx, 2, C.HOOK_METAL);
  p(swing + 3, 1, C.HOOK_METAL); p(swing + 3, 0, C.HOOK_DARK);
}

function drawBoss(cx, cy, frame, type) {
  const s = S, step = frame === 0 ? 1 : -1;
  function p(dx, dy, c) { px(cx + dx * s, cy + dy * s, c, s); }
  const shirtColor = type === 'driver' ? [80,80,100] : (type === 'supervisor' ? C.BOSS_BLUE : [20,20,40]);

  for (let dy = 2; dy <= 7; dy++) {
    p(-2 + step, dy, C.BOSS_PANTS); p(-1 + step, dy, C.BOSS_PANTS);
    p(2 - step, dy, C.BOSS_PANTS); p(1 - step, dy, C.BOSS_PANTS);
  }
  p(-3 + step, 8, C.EYE_BLACK); p(-2 + step, 8, C.EYE_BLACK);
  p(3 - step, 8, C.EYE_BLACK); p(2 - step, 8, C.EYE_BLACK);

  for (let dy = -6; dy <= 1; dy++) {
    let w = (-4 < dy && dy < 0) ? 4 : 3;
    for (let dx = -w; dx <= w; dx++) p(dx, dy, shirtColor);
  }
  for (let dy = -12; dy <= -6; dy++) {
    let w = (-10 < dy && dy < -7) ? 3 : 2;
    for (let dx = -w; dx <= w; dx++) p(dx, dy, C.BOSS_SKIN);
  }
  p(-1, -10, C.EYE_BLACK); p(1, -10, C.EYE_BLACK);
  p(-2, -11, C.EYE_BLACK); p(2, -11, C.EYE_BLACK);
  for (let dx = -1; dx <= 1; dx++) p(dx, -8, [180,60,60]);

  for (let dx = -4; dx <= 4; dx++) p(dx, -13, C.BOSS_HAT);
  for (let dx = -3; dx <= 3; dx++) p(dx, -14, C.BOSS_HAT);

  p(-2, -3, C.BOSS_BADGE); p(-1, -3, C.BOSS_BADGE);

  if (type === 'supervisor') {
    for (let dy = -4; dy <= -1; dy++) { p(5, dy, [200,180,140]); p(6, dy, [200,180,140]); }
    for (let dy = -5; dy <= -1; dy++) p(7, dy, [120,80,40]);
  }
  if (type === 'commissioner') {
    for (let dx = -4; dx <= -3; dx++) p(dx, -6, C.BOSS_BADGE);
    for (let dx = 3; dx <= 4; dx++) p(dx, -6, C.BOSS_BADGE);
  }

  p(-5, -4 + step, C.BOSS_SKIN); p(-5, -3 + step, C.BOSS_SKIN);
  p(5, -4 - step, C.BOSS_SKIN); p(5, -3 - step, C.BOSS_SKIN);
}

function drawCar(cx, cy) {
  const s = S;
  function p(dx, dy, c) { px(cx + dx * s, cy + dy * s, c, s); }
  for (let dy = -4; dy <= 2; dy++)
    for (let dx = -10; dx <= 10; dx++) {
      let c = Math.abs(dx) >= 9 ? C.CAR_DARK : C.CAR_ORANGE;
      if (dx === -5 && dy === 1) c = C.CAR_RUST;
      if (dx === 7 && dy === 0) c = C.CAR_RUST;
      p(dx, dy, c);
    }
  for (let dy = -8; dy <= -4; dy++) {
    let w = dy > -7 ? 6 : 4;
    for (let dx = -w; dx <= w; dx++) p(dx, dy, C.CAR_DARK);
  }
  for (let dy = -7; dy <= -4; dy++)
    for (let dx = -5; dx <= 5; dx++)
      if (dx !== 0) p(dx, dy, C.CAR_WINDOW);
  p(10, -2, [255,255,200]); p(10, -1, [255,255,200]);
  p(-10, -2, [255,40,40]); p(-10, -1, [255,40,40]);
  for (const tdx of [-7, 5])
    for (let dy = 3; dy <= 5; dy++)
      for (let dx = tdx; dx < tdx + 4; dx++) p(dx, dy, C.CAR_TIRE);
}

// ============================================================================
// Game State (mirrors platformer.py)
// ============================================================================
const GROUND_Y = 0.22;
const GRITTY_X = 0.25;
const GRAVITY = -0.002;
const JUMP_VEL = 0.028;
const SCROLL_SPEED = 0.003;
const IMPOUND_SCROLL = 0.0025;
const CLOUD_SPEED = 0.001;
const OBSTACLE_INTERVAL = 180;
const CHEESESTEAK_INTERVAL = 120;
const CLOUD_INTERVAL = 250;
const LEVEL_LENGTH = 800;
const BOSS_SCROLL_SPEED = 0.001;

const GRITTY_HW = 0.03, GRITTY_HH = 0.04;
const OBSTACLE_HW = 0.025, OBSTACLE_HH = 0.03;
const COLLECT_HW = 0.03, COLLECT_HH = 0.02;

let grittyY = GROUND_Y, grittyVY = 0, jumping = false;
let tickCount = 0, score = 0, cheesesteaks = 0;
let phase = 'street', level = 1, phaseTick = 0;
let nextId = 0, gameOver = false, victory = false;
let objects = [];
let bossActive = false, bossHits = 0;
let animFrame = 0;

const levelSequence = [
  ['street',1],['impound',1],['street',2],['impound',2],['street',3],['impound',3]
];
let levelIndex = 0;

// Perf tracking
let fps = 0, frameCount = 0, lastFpsTime = performance.now();
let tickTimeMs = 0;

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function boxOverlap(ax, ay, ahw, ahh, bx, by, bhw, bhh) {
  return Math.abs(ax - bx) < (ahw + bhw) && Math.abs(ay - by) < (ahh + bhh);
}

function spawnObject(type, x, y, speed) {
  if (speed === undefined) speed = phase === 'street' ? SCROLL_SPEED : IMPOUND_SCROLL;
  const id = nextId++;
  const name = type + '_' + id;
  const obj = { id, type, name, x, y, speed, alive: true, frame: 0, frameTick: 0 };

  // Set layer for draw ordering
  if (type === 'cloud' || type === 'hill' || type === 'libertybell') obj.layer = 5;
  else if (type === 'cheesesteak' || type === 'pretzel') obj.layer = 40;
  else if (type.startsWith('boss') || type === 'car') obj.layer = 45;
  else obj.layer = 30;

  objects.push(obj);
  return obj;
}

function destroyObject(obj) { obj.alive = false; }

function startPhase() {
  phaseTick = 0; bossActive = false; bossHits = 0;
  objects.forEach(o => o.alive = false);
  objects = [];

  if (phase === 'street') {
    log('=== STREET LEVEL ' + level + ' ===');
    log('Gritty searches the streets of Philly...');
    spawnObject('cloud', 0.7, 0.80, CLOUD_SPEED);
    spawnObject('cloud', 0.4, 0.85, CLOUD_SPEED);
    if (level >= 2) spawnObject('libertybell', 0.8, 0.65, CLOUD_SPEED);
  } else {
    log('=== PPA IMPOUND LOT ' + level + ' ===');
    log('Gritty breaks into the impound lot!');
  }
}

function advanceLevel() {
  levelIndex++;
  if (levelIndex >= levelSequence.length) {
    victory = true;
    log('*** VICTORY! Gritty found his car! ***');
    log('Cheesesteaks collected: ' + cheesesteaks);
    return;
  }
  [phase, level] = levelSequence[levelIndex];
  startPhase();
}

function spawnStreetObjects() {
  if (phaseTick % OBSTACLE_INTERVAL === 0 && phaseTick > 0) {
    if (phaseTick % (OBSTACLE_INTERVAL * 2) === 0) spawnObject('trashcan', 1.0, GROUND_Y);
    else spawnObject('pigeon', 1.0, GROUND_Y);
  }
  if (phaseTick % CHEESESTEAK_INTERVAL === 0 && phaseTick > 30) {
    let y = GROUND_Y + 0.12 + (phaseTick % 7) * 0.02;
    spawnObject('cheesesteak', 1.0, clamp(y, 0, 1));
  }
  if (phaseTick % 300 === 150) spawnObject('pretzel', 1.0, clamp(GROUND_Y + 0.08, 0, 1));
  if (phaseTick % CLOUD_INTERVAL === 0 && phaseTick > 0) {
    let y = 0.72 + (phaseTick % 5) * 0.03;
    spawnObject('cloud', 1.0, clamp(y, 0, 1), CLOUD_SPEED);
  }
  if (phaseTick % 400 === 200) spawnObject('hill', 1.0, GROUND_Y + 0.02, CLOUD_SPEED * 1.5);
  if (phaseTick === LEVEL_LENGTH) {
    spawnObject('greasedpole', 1.0, GROUND_Y + 0.05, SCROLL_SPEED * 0.7);
    log('The greased pole appears! Almost there!');
  }
}

function spawnImpoundObjects() {
  if (phaseTick % (OBSTACLE_INTERVAL + 20) === 0 && phaseTick > 0 && !bossActive)
    spawnObject('parkingboot', 1.0, GROUND_Y);
  if (phaseTick % (OBSTACLE_INTERVAL + 50) === 80 && !bossActive)
    spawnObject('towhook', 1.0, clamp(GROUND_Y + 0.15, 0, 1));
  if (phaseTick % (CHEESESTEAK_INTERVAL + 40) === 0 && phaseTick > 60 && !bossActive)
    spawnObject('cheesesteak', 1.0, clamp(GROUND_Y + 0.10, 0, 1));
  if (phaseTick === LEVEL_LENGTH && !bossActive) {
    bossActive = true;
    let bossType = level === 1 ? 'boss_driver' : (level === 2 ? 'boss_supervisor' : 'boss_commissioner');
    let msgs = {
      boss_driver: 'BOSS: Angry tow truck driver blocks the way!',
      boss_supervisor: 'BOSS: PPA Supervisor with a clipboard of citations!',
      boss_commissioner: 'FINAL BOSS: The PPA Commissioner stands guard!'
    };
    log(msgs[bossType]);
    spawnObject(bossType, 1.0, GROUND_Y, BOSS_SCROLL_SPEED);
  }
}

// ============================================================================
// Game tick
// ============================================================================
function gameTick() {
  if (gameOver || victory) return;
  tickCount++; phaseTick++;
  animFrame = tickCount % 6;

  // Physics
  if (jumping) {
    grittyVY += GRAVITY;
    grittyY += grittyVY;
    if (grittyY <= GROUND_Y) { grittyY = GROUND_Y; grittyVY = 0; jumping = false; }
  }

  // Move objects
  const toRemove = [];
  for (const obj of objects) {
    if (!obj.alive) { toRemove.push(obj); continue; }
    obj.x -= obj.speed;
    obj.frameTick++;
    if (obj.frameTick % 8 === 0) obj.frame = (obj.frame + 1) % 4;

    if (obj.x < 0.02) {
      if (obj.type === 'greasedpole') {
        log("Gritty slides down the greased pole! Level complete!");
        destroyObject(obj);
        advanceLevel();
        return;
      }
      destroyObject(obj); toRemove.push(obj); continue;
    }
  }
  objects = objects.filter(o => o.alive);

  // Collisions
  for (const obj of objects) {
    if (!obj.alive) continue;
    const t = obj.type;
    if (t === 'cheesesteak' || t === 'pretzel') {
      if (boxOverlap(GRITTY_X, grittyY, GRITTY_HW, GRITTY_HH, obj.x, obj.y, COLLECT_HW, COLLECT_HH)) {
        if (t === 'cheesesteak') { cheesesteaks++; score += 100; log('Cheesesteak! (' + cheesesteaks + ' collected)'); }
        else { score += 50; log('Soft pretzel! +50'); }
        destroyObject(obj);
      }
    } else if (['pigeon','trashcan','parkingboot','towhook'].includes(t)) {
      if (boxOverlap(GRITTY_X, grittyY, GRITTY_HW, GRITTY_HH, obj.x, obj.y, OBSTACLE_HW, OBSTACLE_HH)) {
        if (!jumping || grittyY < obj.y + OBSTACLE_HH) {
          score = Math.max(0, score - 25);
          log('Ouch! Gritty hit a ' + t + '! (-25 points)');
          grittyVY = JUMP_VEL * 0.6; jumping = true;
          destroyObject(obj);
        }
      }
    } else if (t.startsWith('boss_')) {
      if (boxOverlap(GRITTY_X, grittyY, GRITTY_HW, GRITTY_HH, obj.x, obj.y, OBSTACLE_HW * 1.5, OBSTACLE_HH * 1.5)) {
        if (jumping && grittyY > obj.y + OBSTACLE_HH) {
          bossHits++; log('Gritty stomps the boss! (' + bossHits + '/3)');
          grittyVY = JUMP_VEL * 0.8; score += 200;
          if (bossHits >= 3) {
            log('Boss defeated!'); destroyObject(obj); bossActive = false; score += 500;
            if (level === 3 && phase === 'impound') {
              log("Wait... is that... GRITTY'S CAR!");
              spawnObject('car', 1.0, GROUND_Y, SCROLL_SPEED * 0.5);
              log("The stash is still in there! Gritty is OVERJOYED!");
            } else { advanceLevel(); return; }
          }
        } else {
          score = Math.max(0, score - 50); log('The boss pushes Gritty back! (-50)');
          grittyVY = JUMP_VEL * 0.5; jumping = true;
        }
      }
    } else if (t === 'car') {
      if (boxOverlap(GRITTY_X, grittyY, GRITTY_HW, GRITTY_HH, obj.x, obj.y, 0.05, 0.03)) {
        victory = true; score += 1000;
        log("*** GRITTY FOUND HIS CAR! ***");
        log("The stash is still there! He does his drugs and goes for a cheesesteak.");
        log("FINAL SCORE: " + score + " (Cheesesteaks: " + cheesesteaks + ")");
        log("=== GAME OVER: YOU WIN! ===");
        return;
      }
    }
  }

  // Spawning
  if (phase === 'street') spawnStreetObjects();
  else spawnImpoundObjects();

  if (phaseTick > LEVEL_LENGTH + 500 && !bossActive) advanceLevel();
}

// ============================================================================
// Render
// ============================================================================
function render() {
  // Background
  if (phase === 'street') ctx.drawImage(bgStreetCanvas, 0, 0);
  else ctx.drawImage(bgImpoundCanvas, 0, 0);

  // Sort objects by layer
  const sorted = objects.filter(o => o.alive).sort((a, b) => a.layer - b.layer);

  for (const obj of sorted) {
    const [cx, cy] = texToCanvas(clamp(obj.x, 0, 1), clamp(obj.y, 0, 1));
    const f = obj.frame;
    switch (obj.type) {
      case 'pigeon': drawPigeon(cx, cy, f % 2); break;
      case 'trashcan': drawTrashcan(cx, cy); break;
      case 'cheesesteak': drawCheesesteak(cx, cy, f % 4); break;
      case 'pretzel': drawPretzel(cx, cy); break;
      case 'greasedpole': drawGreasedPole(cx, cy); break;
      case 'cloud': drawCloud(cx, cy); break;
      case 'hill': drawHill(cx, cy); break;
      case 'libertybell': drawLibertyBell(cx, cy); break;
      case 'parkingboot': drawParkingBoot(cx, cy, f % 2); break;
      case 'towhook': drawTowHook(cx, cy, f % 2); break;
      case 'boss_driver': drawBoss(cx, cy, f % 2, 'driver'); break;
      case 'boss_supervisor': drawBoss(cx, cy, f % 2, 'supervisor'); break;
      case 'boss_commissioner': drawBoss(cx, cy, f % 2, 'commissioner'); break;
      case 'car': drawCar(cx, cy); break;
    }
  }

  // Gritty (always on top of objects)
  const grittyFrame = jumping ? 3 : animFrame;
  const [gx, gy] = texToCanvas(GRITTY_X, clamp(grittyY, 0, 1));
  drawGritty(gx, gy, grittyFrame);

  // HUD
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(0, 0, W, 28);
  ctx.fillStyle = '#ff8200'; ctx.font = 'bold 14px Courier New';
  ctx.fillText('SCORE: ' + score, 10, 18);
  ctx.fillStyle = '#fff';
  ctx.fillText('CHEESESTEAKS: ' + cheesesteaks, 180, 18);
  ctx.fillStyle = '#aaa';
  const phaseLabel = phase === 'street' ? 'STREET ' + level : 'PPA LOT ' + level;
  ctx.fillText(phaseLabel, 420, 18);
  if (bossActive) { ctx.fillStyle = '#f44'; ctx.fillText('BOSS: ' + bossHits + '/3', 580, 18); }
  ctx.fillStyle = '#888'; ctx.fillText('FPS: ' + fps, W - 80, 18);

  // Victory/game over overlay
  if (victory) {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, H / 2 - 80, W, 160);
    ctx.fillStyle = '#ff8200'; ctx.font = 'bold 32px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText("GRITTY FOUND HIS CAR!", W / 2, H / 2 - 20);
    ctx.fillStyle = '#fff'; ctx.font = '18px Courier New';
    ctx.fillText("The stash is still there. Score: " + score, W / 2, H / 2 + 20);
    ctx.fillText("Click to play again", W / 2, H / 2 + 50);
    ctx.textAlign = 'left';
  }
}

// ============================================================================
// Console panel update
// ============================================================================
function updateConsole() {
  // Log tab
  document.getElementById('log-output').textContent = logLines.slice(-50).join('\n');
  const logEl = document.getElementById('log-section');
  logEl.scrollTop = logEl.scrollHeight;

  // Sprites tab
  let spritesHtml = '<div style="color:#aaa;margin-bottom:4px">Active sprites: ' + objects.filter(o=>o.alive).length + '</div>';
  for (const obj of objects.filter(o => o.alive)) {
    spritesHtml += '<div class="sprite-entry">'
      + '<span class="sprite-name">' + obj.name + '</span> '
      + '<span class="sprite-type">[' + obj.type + ']</span><br>'
      + '<span class="sprite-pos">pos=(' + obj.x.toFixed(3) + ', ' + obj.y.toFixed(3)
      + ') spd=' + obj.speed.toFixed(4) + ' frame=' + obj.frame + ' layer=' + obj.layer + '</span>'
      + '</div>';
  }
  document.getElementById('sprites-output').innerHTML = spritesHtml;

  // State tab
  document.getElementById('state-output').innerHTML =
    '<div><span class="state-key">phase</span> = <span class="state-val">' + phase + '</span></div>'
    + '<div><span class="state-key">level</span> = <span class="state-val">' + level + '</span></div>'
    + '<div><span class="state-key">levelIndex</span> = <span class="state-val">' + levelIndex + '/' + levelSequence.length + '</span></div>'
    + '<div><span class="state-key">tick</span> = <span class="state-val">' + tickCount + '</span></div>'
    + '<div><span class="state-key">phaseTick</span> = <span class="state-val">' + phaseTick + '</span></div>'
    + '<div><span class="state-key">score</span> = <span class="state-val">' + score + '</span></div>'
    + '<div><span class="state-key">cheesesteaks</span> = <span class="state-val">' + cheesesteaks + '</span></div>'
    + '<div><span class="state-key">grittyY</span> = <span class="state-val">' + grittyY.toFixed(4) + '</span></div>'
    + '<div><span class="state-key">grittyVY</span> = <span class="state-val">' + grittyVY.toFixed(4) + '</span></div>'
    + '<div><span class="state-key">jumping</span> = <span class="state-val">' + jumping + '</span></div>'
    + '<div><span class="state-key">bossActive</span> = <span class="state-val">' + bossActive + '</span></div>'
    + '<div><span class="state-key">bossHits</span> = <span class="state-val">' + bossHits + '</span></div>'
    + '<div><span class="state-key">victory</span> = <span class="state-val">' + victory + '</span></div>';

  // Perf tab
  document.getElementById('perf-output').innerHTML =
    '<div><span class="perf-label">FPS:</span> <span class="' + (fps < 30 ? 'perf-warn' : 'perf-val') + '">' + fps + '</span></div>'
    + '<div><span class="perf-label">Tick time:</span> <span class="perf-val">' + tickTimeMs.toFixed(1) + 'ms</span></div>'
    + '<div><span class="perf-label">Objects:</span> <span class="perf-val">' + objects.filter(o=>o.alive).length + '</span></div>'
    + '<div><span class="perf-label">Total ticks:</span> <span class="perf-val">' + tickCount + '</span></div>'
    + '<div><span class="perf-label">Game time:</span> <span class="perf-val">' + (tickCount / 60).toFixed(1) + 's</span></div>';
}

// ============================================================================
// Main loop
// ============================================================================
let lastTime = 0;
const TICK_RATE = 1000 / 60; // ~60 ticks per second
let accumulator = 0;
let consoleTimer = 0;

function gameLoop(timestamp) {
  if (!lastTime) lastTime = timestamp;
  let dt = timestamp - lastTime;
  lastTime = timestamp;
  accumulator += dt;

  // FPS counter
  frameCount++;
  if (timestamp - lastFpsTime >= 1000) {
    fps = frameCount;
    frameCount = 0;
    lastFpsTime = timestamp;
  }

  // Fixed timestep game ticks
  while (accumulator >= TICK_RATE) {
    const t0 = performance.now();
    gameTick();
    tickTimeMs = performance.now() - t0;
    accumulator -= TICK_RATE;
  }

  render();

  // Update console at lower rate
  consoleTimer += dt;
  if (consoleTimer > 200) { updateConsole(); consoleTimer = 0; }

  requestAnimationFrame(gameLoop);
}

// ============================================================================
// Input
// ============================================================================
function doJump() {
  if (victory) {
    // Reset game
    grittyY = GROUND_Y; grittyVY = 0; jumping = false;
    tickCount = 0; score = 0; cheesesteaks = 0;
    phase = 'street'; level = 1; phaseTick = 0;
    nextId = 0; gameOver = false; victory = false;
    objects = []; bossActive = false; bossHits = 0;
    levelIndex = 0;
    log(''); log('=== NEW GAME ===');
    [phase, level] = levelSequence[0];
    startPhase();
    return;
  }
  if (!jumping && !gameOver) {
    jumping = true;
    grittyVY = JUMP_VEL;
  }
}

canvas.addEventListener('click', doJump);
document.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.key === ' ') { e.preventDefault(); doJump(); }
});

// Console tabs
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.console-section').forEach(s => s.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById(tab.dataset.tab + '-section').classList.add('active');
  });
});

// Console eval input
document.getElementById('console-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const code = e.target.value;
    try {
      const result = eval(code);
      log('> ' + code + ' => ' + JSON.stringify(result));
    } catch (err) {
      log('> ' + code + ' => ERROR: ' + err.message);
    }
    e.target.value = '';
  }
});

// ============================================================================
// Init
// ============================================================================
bgStreetCanvas = renderBgStreet();
bgImpoundCanvas = renderBgImpound();

log("=== GRITTY'S PHILLY ADVENTURE ===");
log("Gritty woke up hungover. Where's his car?!");
log("Click anywhere to jump!");
log("");
startPhase();

requestAnimationFrame(gameLoop);
</script>
